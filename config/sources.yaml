# Sources per section.
# - research_domains: where the Claude research task searches first (it may use other reputable outlets).
# - feeds: RSS/Atom feeds used only by the Gemini backup writer. Verified by probe.yml (Phase 0);
#   a feed that fails is skipped at run time, so a broken URL never blocks an episode.

ai:
  research_domains:
    - anthropic.com
    - openai.com
    - deepmind.google
    - blog.google
    - mistral.ai
    - simonwillison.net
    - latent.space
    - deeplearning.ai
    - lennysnewsletter.com
    - techcrunch.com
    - theverge.com
    - arstechnica.com
  feeds:
    - {name: "Simon Willison", url: "https://simonwillison.net/atom/everything/"}
    - {name: "OpenAI News", url: "https://openai.com/news/rss.xml"}
    - {name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml"}
    - {name: "Latent Space", url: "https://www.latent.space/feed"}
    - {name: "TechCrunch AI", url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
    - {name: "The Verge AI", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"}

